# penn-catalog: fetches Penn's public course data on a GitHub runner, for the
# degree planner. The cloud sessions that build Smooth cannot reach Penn's
# hosts, and a runner can, so the planner's data snapshot is made here and
# uploaded as an artifact; a person or a session downloads it, reviews it and
# commits it. Nothing here signs in anywhere or reads any student's data:
# every URL is a public page (Penn's catalog, the CIS advising list, Penn
# Labs' public course API).
#
# It runs when this file or scripts/penn-catalog/ changes on degree-progress.
name: penn-catalog

on:
  push:
    branches: [degree-progress]
    paths:
      - ".github/workflows/penn-catalog.yml"
      - "scripts/penn-catalog/**"
      - "backend/supabase/functions/_shared/degreePlanner/**"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Probe Path@Penn's public program and course endpoints
        run: node scripts/penn-catalog/probe-path.mjs
      - name: Planner dry run on live Penn data
        run: deno run --allow-net --allow-read --allow-env scripts/penn-catalog/dry-run.ts
      - name: Fetch
        run: node scripts/penn-catalog/fetch.mjs out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penn-catalog
          path: out

  # Checks the unverified rules in docs/research/degree-data/RULES.md against
  # Penn's own pages. Read-only: the verdicts are in the job log.
  verify-rules:
    # A 600-page crawl of Penn's sites: only for a commit that asks for it
    # with "[verify-rules]" in its message.
    if: contains(github.event.head_commit.message, '[verify-rules]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pdftotext
        run: sudo apt-get install -y -q poppler-utils > /dev/null
      - name: Check each unverified rule's quote against Penn's pages
        run: node scripts/penn-catalog/verify-rules.mjs

  # Fetches Penn's public requirement template for every undergraduate
  # program and replaces the orphan branch penn-data-raw with them, so the
  # pack parser can be built and reviewed against the real templates.
  # Runs only for a commit whose message contains "[programs]", so an edit to
  # another script here does not ask Penn for 400 templates again.
  programs:
    if: contains(github.event.head_commit.message, '[programs]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the templates
        run: node scripts/penn-catalog/fetch-programs.mjs raw
      - name: Replace penn-data-raw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd raw
          git init -q -b penn-data-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Path@Penn program templates, fetched $(date -u +%F)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" penn-data-raw
      # The packs are what the planner reads: one JSON file per program,
      # parsed from the templates just fetched. Unlike penn-data-raw this
      # branch keeps its history, so a commit there shows exactly what Penn
      # changed. The function reads it at a commit pinned in the code, so
      # nothing published here reaches a student until a person moves the pin.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build the packs
        run: deno run --allow-read --allow-write scripts/penn-catalog/build-packs.ts raw packs --check
      - name: Publish penn-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$remote" refs/heads/penn-data > /dev/null; then
            git clone -q --depth 1 --branch penn-data "$remote" data
          else
            mkdir data && git -C data init -q -b penn-data
          fi
          rm -rf data/packs data/programs.json
          cp -r packs/packs packs/programs.json data/
          printf '%s\n' "# Penn program packs" "" "One JSON file per undergraduate program, parsed from Path@Penn's public" "requirement templates by scripts/penn-catalog/build-packs.ts on a GitHub" "runner. Public Penn data; nothing about any student. Never merge this branch." > data/README.md
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Program packs from templates fetched $(date -u +%F)"
          git push "$remote" penn-data
          git rev-parse HEAD
