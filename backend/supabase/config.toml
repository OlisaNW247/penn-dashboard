# Minimal local/project config for the LHF backend. Only the settings that
# differ from `supabase init` defaults are spelled out; everything else is
# left at the CLI's default so this file doesn't drift from upstream churn.
project_id = "lhf"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# Identity is anonymous per PROTOCOL.md: no email, no password, no accounts.
# The server only needs a stable user id to scope enrollments, ask usage and
# quotas -- nothing more.
enable_anonymous_sign_ins = true

[functions.sync]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.ask]
verify_jwt = true

[functions.extract-profile]
verify_jwt = true

[functions.extract-announcement]
verify_jwt = true

# The agent connection (docs/AGENT_CONNECTION_PLAN_V11_2026-11-07.md). Both
# are called without a Supabase JWT: `agent-auth` by a browser and by Claude's
# servers during OAuth discovery, `mcp` with our own opaque bearer token that
# `mcp/index.ts` verifies itself. With the gateway check on, discovery would
# 401 before our code ran. `backend/scripts/deploy-function.mjs` sends the
# same two as `verify_jwt: false` (`PUBLIC_SLUGS`).
[functions.agent-auth]
verify_jwt = false

[functions.mcp]
verify_jwt = false

# The phone uploads the agent-visible snapshot here with the student's own
# Supabase JWT, so the gateway check stays on.
[functions.agent-snapshot]
verify_jwt = true
