name: LowHangingFruit
options:
  bundleIdPrefix: com.lhf
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  LowHangingFruitKit:
    path: LowHangingFruitKit
targets:
  LowHangingFruit:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "make-ios-icon.swift"
    dependencies:
      - package: LowHangingFruitKit
        product: LowHangingFruitUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LHF
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lhf.lowhangingfruit
        # Mac App Store requires App Sandbox; entitlements apply to the macOS build only.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/LowHangingFruit-macOS.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
