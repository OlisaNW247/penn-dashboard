name: LowHangingFruit
options:
  bundleIdPrefix: com.lhf
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  LowHangingFruitKit:
    path: LowHangingFruitKit
targets:
  LowHangingFruit:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "make-ios-icon.swift"
    dependencies:
      - package: LowHangingFruitKit
        product: LowHangingFruitUI
      # The widget extension is an iOS-only app-extension embedded in the app.
      #
      # Do NOT use `platforms: [iOS]` here. xcodegen 2.45.4 does not filter
      # such a dependency per-platform — it silently discards the dependency
      # entirely, leaving zero target dependencies and zero copy-files phases,
      # so the .appex is built and thrown away and the widget never appears on
      # device.
      #
      # `platformFilter: iOS` is the spelling that works: it keeps the
      # dependency AND writes Xcode's `platformFilter` attribute, so the macOS
      # destination skips embedding an iOS-only appex (which is a hard build
      # error). It is case-sensitive — lowercase `ios` is silently ignored,
      # and `platformFilters` (plural) is not supported at all.
      - target: LHFWidgetExtension
        embed: true
        platformFilter: iOS
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Smooth
        # macOS reads the application menu (the bold one beside the Apple
        # logo), the Dock label and the Finder name from CFBundleName, NOT
        # from CFBundleDisplayName -- so leaving this at its $(PRODUCT_NAME)
        # default is why the Mac build still called itself "LowHangingFruit"
        # while the phone said Smooth. iOS is the reverse: it prefers
        # CFBundleDisplayName, which is why this went unnoticed for as long
        # as the phone was the only thing anyone looked at. Both keys are set
        # now, to the same string; they are not interchangeable.
        #
        # It has to be declared here and not only in App/Info.plist, for the
        # same reason as the version keys below: the Mac archive lane is the
        # one place that has to run `xcodegen generate` (for the per-SDK
        # entitlements override), and that rewrites the .plist from this list
        # -- so a value living only on disk would be replaced by the default
        # by the very step the Mac build requires.
        #
        # CFBundleName is not the whole fix on its own. Finder, Launchpad and
        # the Dock label an app by the file name of its bundle, so the icon in
        # /Applications would still have read "LowHangingFruit" with only this
        # key changed -- which is why PRODUCT_NAME moves too, below.
        CFBundleName: Smooth
        # Required for the Mac App Store. Without it the archive warns "No App
        # Category is set" and upload validation rejects the build outright;
        # iOS never needed it, which is why it was missing for four builds.
        # One value serves both platforms, and it must match the category on
        # the App Store Connect listing — Universal Purchase shares one app
        # record, so a mismatch is a review flag, not a second listing.
        LSApplicationCategoryType: public.app-category.education
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # No UIUserInterfaceStyle here on purpose: pinning it to Light at the
        # system level overrides the in-app Light/Dark appearance setting, so
        # dark mode could never actually engage. The app applies its own
        # preferred scheme from `AppState.appearance` instead.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Background refresh (docs/BACKGROUND_REFRESH_PLAN.md, Option A).
        # `fetch` is the UIBackgroundModes value BGAppRefreshTask requires;
        # the permitted-identifiers list must match
        # `LHFBackgroundRefresh.taskID` exactly or registration/submission
        # silently fail against each other.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.lhf.lowhangingfruit.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lhf.lowhangingfruit
        # The built bundle is Smooth.app, not LowHangingFruit.app. This is the
        # half of the rename that CFBundleName cannot do: macOS labels an icon
        # in Finder, Launchpad and the Dock with the bundle's *file name*, so
        # the Mac icon read "LowHangingFruit" no matter what the Info.plist
        # said. On iOS none of this was visible -- the Home Screen reads
        # CFBundleDisplayName -- which is why it survived every phone build.
        #
        # Only the product name changes. The bundle id stays
        # com.lhf.lowhangingfruit, so this is an update to the same App Store
        # record and not a new app, and every path derived from the bundle id
        # -- the App Group container that holds the SwiftData ledger, the
        # Keychain items, the widget's shared defaults -- is untouched, so no
        # student loses anything on updating. The Xcode scheme is still called
        # LowHangingFruit (a scheme name is not a product name), so the
        # commands in CLAUDE.md still work unchanged.
        #
        # What this does break is any script that hard-codes the built
        # product's path; capture-screenshots.sh and the App Store docs were
        # updated with it (bundle-mac.sh was not -- it bundles the SwiftPM
        # executable under its own com.olisa.* id and never touches this
        # target). One cosmetic cost on the Mac, accepted knowingly:
        # an existing 1.2.1 user who has the old bundle pinned to their Dock
        # will get a stale tile when the update replaces LowHangingFruit.app
        # with Smooth.app, and has to re-pin it.
        PRODUCT_NAME: Smooth
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 24A3TDB277
        CODE_SIGN_ENTITLEMENTS: App/LHFApp.entitlements
        # The Mac build needs a different entitlements file, not a superset of
        # the iOS one. The Mac App Store requires the sandbox, and a sandboxed
        # macOS app group MUST carry the team-id prefix — the bare
        # `group.com.lhf.lowhangingfruit` iOS uses is not a valid macOS group at
        # all, so shipping the iOS file would fail provisioning or, worse,
        # resolve to no container and drop the ledger into memory.
        # `WidgetSharing.resolveAppGroupID` is the runtime half of this.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/LHFApp-macOS.entitlements

  # Home Screen + Lock Screen widget. iOS-only WidgetKit extension; reads the
  # "next due" snapshot the app writes to the shared App Group container.
  LHFWidgetExtension:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: LHFWidget
        excludes:
          - "*.entitlements"
    dependencies:
      - package: LowHangingFruitKit
        product: LowHangingFruitKit
    # `xcodegen generate` rewrites this file from scratch from `properties`
    # below — it does not merge with what's on disk. The NSExtension block is
    # what makes this bundle a WidgetKit extension at all, so it MUST live
    # here; when it only lived in the .plist, every regeneration deleted it and
    # silently produced a non-widget app-extension.
    info:
      path: LHFWidget/Info.plist
      properties:
        CFBundleDisplayName: Smooth
        # Same split as the app target: CFBundleDisplayName covers iOS, and
        # macOS reads CFBundleName. Declared here rather than in the .plist
        # because this file is regenerated -- see the note above.
        CFBundleName: Smooth
        # Must be declared HERE, not just in the .plist on disk: this file is
        # rewritten from scratch on every `xcodegen generate` (see the comment
        # above), so version keys left only in the .plist are silently wiped,
        # and they then default to a literal "1.0" against the app's own
        # version. An app extension whose CFBundleShortVersionString differs
        # from its containing app is an App Store validation failure.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lhf.lowhangingfruit.widget
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "8"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 24A3TDB277
        CODE_SIGN_ENTITLEMENTS: LHFWidget/LHFWidget.entitlements
