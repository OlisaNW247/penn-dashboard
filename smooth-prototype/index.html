<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F7F7" />
    <meta
      name="description"
      content="Locust assignment tracker — interactive design prototype"
    />
    <title>Locust — assignment tracker prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="Locust mobile app prototype">
        <header class="status-bar" aria-label="Phone status">
          <time id="statusTime">9:41</time>
          <div class="dynamic-island" aria-hidden="true"></div>
          <div class="status-icons" aria-hidden="true">
            <span class="signal"><i></i><i></i><i></i><i></i></span>
            <span class="wifi">◒</span>
            <span class="battery"><i></i></span>
          </div>
        </header>

        <div class="app-shell">
          <header class="app-header">
            <div>
              <span class="brand-kicker">LOCUST / FOCUS</span>
              <h1>Good <span id="dayPeriod">afternoon.</span></h1>
              <p><span id="dateLabel">Friday, September 11</span></p>
            </div>
            <div class="header-actions">
              <button class="round-button add-button" id="openAdd" type="button" aria-label="Add assignment">+</button>
              <button class="round-button menu-button" id="openMenu" type="button" aria-label="Open prototype menu" aria-expanded="false"><span></span><span></span></button>
            </div>
          </header>

          <aside class="prototype-menu" id="prototypeMenu" hidden>
            <div>
              <strong>Prototype mode</strong>
              <span>Changes stay in this browser.</span>
            </div>
            <button type="button" id="resetData">Reset</button>
          </aside>

          <nav class="segments" aria-label="Assignment filters">
            <button class="segment active" type="button" data-filter="todo" aria-pressed="true">Todo</button>
            <button class="segment" type="button" data-filter="all" aria-pressed="false">All</button>
            <button class="segment" type="button" data-filter="done" aria-pressed="false">Done</button>
          </nav>

          <section class="focus-signal" aria-label="48 hour workload">
            <div class="signal-copy">
              <span>Next 48 hours</span>
              <strong><span id="todoCount">4</span><span class="need-copy">things need you</span></strong>
            </div>
            <div class="signal-track" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </section>

          <div class="assignment-list" id="assignmentList" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <section class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-heading">
        <div>
          <span class="eyebrow">New assignment</span>
          <h2 id="sheetTitle">Add something due</h2>
        </div>
        <button class="sheet-close" id="closeAdd" type="button" aria-label="Close add assignment sheet">×</button>
      </div>

      <form id="addForm">
        <label>
          <span>Course</span>
          <input id="courseInput" name="course" autocomplete="off" placeholder="CIS 1210" required maxlength="18" />
        </label>
        <label>
          <span>Assignment</span>
          <input id="titleInput" name="title" autocomplete="off" placeholder="Problem set 7" required maxlength="70" />
        </label>
        <label>
          <span>Due date</span>
          <input id="dueInput" name="due" type="datetime-local" required />
          <small>Locust assigns urgency from this date.</small>
        </label>
        <button class="save-button" type="submit">Add assignment</button>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
