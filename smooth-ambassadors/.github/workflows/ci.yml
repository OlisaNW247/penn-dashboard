name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: refuse secrets and contact details
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$BASE" HEAD | xargs -r node scripts/check-no-secrets.mjs
          else
            git ls-files | xargs node scripts/check-no-secrets.mjs
          fi
      - run: npm test
