<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="poster.css"><style>
.page { background: var(--tomato); color: var(--ink); }
html, body { background: var(--tomato); }
.clock { font-family: "Space Mono"; font-weight: 700; font-size: 560px; letter-spacing: -0.06em; line-height: 0.9; color: var(--paper); }
.clock small { display: block; font-size: 110px; letter-spacing: 0.1em; color: var(--ink); margin-top: 40px; }
h1 { font-size: 290px; margin-top: 180px; color: var(--ink); }
h1 span { color: var(--paper); }
.sub { margin-top: 140px; font-size: 140px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; color: var(--ink); max-width: 1900px; }
.foot .brand .w, .foot .brand .s { color: var(--ink); }
.qr { border-color: rgba(27,23,20,.45); color: var(--ink); background: var(--paper); border-style: dashed; }
.mark { outline: 8px solid var(--ink); outline-offset: -8px; }
</style></head><body><div class="page">
  <div class="clock">11:49<small>PM</small></div>
  <h1>ten minutes.<br><span>not turned in.</span></h1>
  <div class="sub">the smooth sweeper rings an alarm before anything you forgot. through silent mode.</div>
  <div class="foot"><div class="brand"><div class="mark"><img src="../../../LowHangingFruitKit/Sources/LowHangingFruitUI/Resources/smooth-mark.png"></div><div><div class="w">smooth</div><div class="s">free on the app store</div></div></div><div class="qr">qr sticker<small>goes here</small></div></div>
</div></body></html>
