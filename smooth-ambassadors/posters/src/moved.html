<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="poster.css"><style>
.time { font-family: "Space Mono"; font-weight: 700; font-size: 190px; color: var(--muted); letter-spacing: -0.02em; }
h1 { font-size: 290px; margin-top: 50px; }
.card { margin-top: 150px; background: var(--paper); border: 6px solid var(--ink); border-radius: 64px; padding: 90px 100px; box-shadow: 34px 34px 0 var(--cobalt); position: relative; }
.card .code { font-family: "Space Mono"; font-weight: 700; font-size: 54px; color: var(--cobalt-ink); letter-spacing: 0.08em; }
.card .t { font-size: 135px; font-weight: 700; letter-spacing: -0.03em; margin-top: 30px; line-height: 1; }
.card .due { margin-top: 70px; display: flex; align-items: baseline; gap: 50px; }
.card .old { font-family: "Space Mono"; font-size: 70px; color: var(--muted); text-decoration: line-through; text-decoration-thickness: 8px; }
.card .new { font-family: "Space Mono"; font-weight: 700; font-size: 120px; color: var(--tomato-ink); }
.tag { position: absolute; top: -50px; right: 90px; background: var(--marigold); color: var(--ink); font-family: "Space Mono"; font-weight: 700; font-size: 44px; padding: 20px 40px; border-radius: 999px; letter-spacing: 0.1em; }
.sub { margin-top: 150px; font-size: 175px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
.sub b { color: var(--cobalt-ink); font-weight: 800; }
</style></head><body><div class="page">
  <div class="time">11:58 pm</div>
  <h1>your professor<br>just moved<br>the deadline.</h1>
  <div class="card"><div class="tag">MOVED</div><div class="code">ECON 101</div><div class="t">problem set 4</div><div class="due"><span class="old">fri 11:59 pm</span><span class="new">tonight</span></div></div>
  <div class="sub"><b>smooth</b> already knows.</div>
  <div class="foot"><div class="brand"><div class="mark"><img src="../../../LowHangingFruitKit/Sources/LowHangingFruitUI/Resources/smooth-mark.png"></div><div><div class="w">smooth</div><div class="s">free on the app store</div></div></div><div class="qr">qr sticker<small>goes here</small></div></div>
</div></body></html>
